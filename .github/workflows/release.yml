name: release

# Тег v1.2.3 → сборка на Windows → проверка exe на записи → релиз с установщиком и портативным zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: python -m pip install -r requirements-build.txt

      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Модели
        run: python scripts/fetch_models.py

      - name: Версия в коде совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: grep -q "__version__ = \"${GITHUB_REF_NAME#v}\"" notetaker/app.py

      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Сборка
        env:
          PYTHONUTF8: "1"
        run: python scripts/build.py

      - name: Проверка exe — расшифровка без Python
        shell: pwsh
        run: |
          python -c "import numpy as np, soundfile as sf; t=np.arange(48000*5)/48000; x=np.stack([0.1*np.sin(2*np.pi*220*t)]*2,1); sf.write('smoke.ogg', x, 48000, format='OGG', subtype='OPUS')"
          $p = Start-Process build\dist\Notetaker\Notetaker.exe -ArgumentList "--transcribe", "$PWD\smoke.ogg", "$PWD\smoke.md" -Wait -PassThru
          Get-Content smoke.md.log -Encoding utf8
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path smoke.md.log -Pattern "готово" -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: notetaker
          path: |
            dist/Notetaker-*-setup.exe
            dist/Notetaker-*-portable.zip
          retention-days: 7

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/Notetaker-*-setup.exe
            dist/Notetaker-*-portable.zip
          fail_on_unmatched_files: true
          body: |
            **Установщик** — файл `…-setup.exe` (без прав администратора).
            **Без установки** — файл `…-portable.zip`: распакуйте и запустите `Notetaker.exe`.

            Windows может предупредить, что программа не подписана: «Подробнее» → «Выполнить в любом случае».
